# FPL_V2_DESIGN.md spec §2.0 — automation as a PREREQUISITE for the
# availability snapshot (spec §2), not a nice-to-have. A snapshot script
# only has value if it runs reliably without anyone remembering: a human
# forgets on busy weeks, and busy weeks correlate with congested fixture
# schedules — exactly when rotation/injury news matter most. That
# correlation would bias any model later fit on the result (spec §5).
#
# Deadlines move (midweek rounds, cup weekends, festive scheduling), so a
# fixed cron cannot land at a constant offset from every deadline. That is
# accepted rather than engineered around: hours_to_deadline is recorded
# EXACTLY on every row (fpl/collect/snapshot.py), so cron drift is captured
# IN the data rather than hidden by it.
name: FPL weekly pipeline

on:
  schedule:
    # All times UTC. Four touchpoints per spec §2.0's table:
    - cron: "0 9 * * 2"   # Tue 09:00 — main run: previous GW final, projections rebuilt
    - cron: "0 9 * * 5"   # Fri 09:00 — refresh: press conferences, injury news
    - cron: "0 9 * * 6"   # Sat 09:00 — pre-deadline (most Saturday deadlines are 11:00/11:30)
    - cron: "0 16 * * 6"  # Sat 16:00 — post-deadline: captures the resolved lineup picture
  workflow_dispatch: {}   # manual trigger

# NOTE: once a `permissions:` block exists, every scope NOT listed here
# defaults to `none` -- it is not additive to the repo default. Omitting
# `issues: write` made the failure-notification step below 403 with
# "Resource not accessible by integration" on every failed run, silently.
# Proven by a deliberate failure test on 2026-08-22; see PROJECT_LOG section 15.
permissions:
  contents: write  # needed to commit regenerated artefacts back to main
  issues: write    # needed by the failure-notification step to open/comment

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect — live FPL data (bootstrap-static, fixtures)
        run: python -m fpl.collect.fpl_client

      # 3 completed seasons + the current season (PROJECT_LOG §17): the
      # current season feeds minutes.py's rolling start-rate window so an
      # in-season role change isn't invisible for weeks. 404s pre-season.
      - name: Collect — historical archive (vaastav, 3 seasons + current)
        run: python -m fpl.collect.history_loader

      # Spec §2.3: conceptually runs immediately after get_bootstrap_static()
      # and before any transform step — snapshot.py reads the raw file
      # fpl.collect.fpl_client just pulled and saved rather than re-pulling
      # (see its own docstring). One call: __main__ internally attempts the
      # transform/project steps itself to fill in minutes_factor, and falls
      # back to writing the raw fields alone (minutes_factor null) if that
      # fails — so a projection failure never costs this run its row. The
      # transform/decide steps below are the pipeline's own separate,
      # committed-artefact-producing run of that same work, not a second
      # snapshot write.
      - name: Collect — availability snapshot
        run: python -m fpl.collect.snapshot

      # v4 plan §3.3 (Tier 0.3): the availability snapshot is the one
      # append-only, irreversible artefact this project cares most about
      # not silently losing. A failed Actions run is an email that's easy
      # to learn to ignore; this makes staleness fail the JOB loudly
      # instead, so a dead pipeline can't go unnoticed for weeks.
      - name: Assert availability snapshot isn't stale
        run: python scripts/check_staleness.py

      # PROJECT_LOG §20: graded per-player results for every settled gameweek,
      # appended to data/actuals/. fpl/project/minutes.py reads the current
      # season's `starts` from here in preference to vaastav's merged_gw.csv,
      # which republishes ~1 GW behind the FPL API — so an in-season role
      # change (Wissa: injury tail at the old club) stops being invisible for
      # weeks. append_actuals is guarded on `event` already present, so
      # re-running settled gameweeks is a no-op.
      - name: Collect — actuals for every settled gameweek
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from fpl.collect import actuals
          bs = json.loads(Path("data/raw/bootstrap_static.json").read_text(encoding="utf-8"))
          for e in bs["events"]:
              if e.get("finished") and e.get("data_checked"):
                  actuals.collect_gameweek_actuals(e["id"])
          PY

      # PROJECT_LOG §22: parse FPL's free-text `news` field into a structured
      # start-probability, cached by a hash of the text (data/news/). Consumed
      # only by challenger model m6_news. Degrades to cache-only if the secret
      # is unset — must not fail the job.
      - name: Parse — team news (model M6 input)
        run: python -m fpl.project.news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Transform — players + fixtures tables
        run: |
          python -m fpl.transform.build_players
          python -m fpl.transform.build_fixtures

      # Runs the full project layer (baseline/fixtures/minutes/defcon) via
      # optimiser.py's own import chain, then the two-stage MILP squad/XI/
      # captain solve. Does NOT call fpl.evaluate.backtest — that is a
      # Phase 3 one-off retrospective deliverable (docs/HANDOFF.md §6), not
      # an ongoing per-GW check; re-running it here on a schedule would
      # silently start treating it as something it isn't. The plan's
      # `fpl/evaluate/evaluate.py` (ongoing, per-GW) is a separate,
      # not-yet-built script for that job.
      - name: Decide — squad/XI/captain recommendations
        run: python -m fpl.decide.optimiser

      # PROJECT_LOG §22: the M6 challenger projection (M0 rules + news-aware
      # minutes) into data/projections/m6_news/. Archived-only — never a
      # decision input. Parallels how M2/M3 would be produced; only M6 is
      # wired for now.
      - name: Project — M6 challenger (m6_news)
        run: |
          python - <<'PY'
          from fpl.project import project as p
          cfg = p.load_config()
          p.project_gameweeks(cfg["horizon"]["gameweeks"], cfg, model="m6_news")
          PY
        env:
          PYTHONPATH: "."

      # Phase G (docs/superpowers/specs/2026-08-22-history-layer-design.md):
      # append-only, provenance-stamped, hive-partitioned archive. Replaces
      # the Tier 0.2 crude copy step. Placed immediately after Decide so the
      # archive unambiguously captures what the pipeline decided, and is not
      # downstream of build_dashboard_data.py's known data/processed
      # overwrite bug (docs/HANDOFF.md §9).
      - name: Archive this run (append-only, provenance-stamped)
        run: python -m fpl.history.archive

      # PROJECT_LOG §21: per-GW regret (captaincy / bench / squad), graded
      # against data/actuals/ for every settled gameweek that has a committed
      # data/state/squad_gw{n}.json. compute_settled_hindsight skips (never
      # fails the job) a GW with no squad state — GW2+ until transfers.py is
      # wired (CLAUDE.md known-open) — or unsettled actuals. NOT model_health:
      # that is fpl.evaluate.backtest, a retrospective one-off the pipeline
      # deliberately never schedules (see the Decide step's note + DECISION_RULE).
      - name: Evaluate — per-GW hindsight regret for settled gameweeks
        run: python -m fpl.evaluate.hindsight all

      # PROJECT_LOG §22: relative Brier of M6 vs M0 minutes_factor against
      # the actual `starts` flag, full + news-signal subset. Feeds the
      # docs/M6_PREREGISTRATION.md promotion check. Skips a GW with no
      # actuals; never fails the job.
      - name: Evaluate — M6 vs M0 news scorecard
        run: python -m fpl.evaluate.news_scorecard all
        env:
          PYTHONPATH: "."

      # Phase G: reads data/history/ via fpl.history.query only. Runs BEFORE
      # the dashboard build so this run's history.json is the one embedded
      # into index.html.
      - name: Dashboard history data (reads the archive, never recomputes)
        run: python scripts/build_history_data.py

      # PROJECT_LOG §19: your ACTUAL squad + a roll/1/2/wildcard comparison.
      # One cheap public entry pull; sell prices from data/private/my_team.json
      # if present (it won't be in CI — market price is the documented proxy).
      # Runs BEFORE build_dashboard_data.py, which inlines dashboard/my_team.json.
      - name: Dashboard "My Team" data (your squad + transfer/wildcard analysis)
        run: python scripts/build_my_team_data.py
        env:
          PYTHONPATH: "."

      - name: Dashboard data (reads pipeline outputs, never recomputes)
        run: python scripts/build_dashboard_data.py
        env:
          PYTHONPATH: "."

      # PROJECT_LOG §18: freeze this run's self-contained index.html as
      # dashboard/weeks/gw{N}.html and rebuild the archive index. Byte copy —
      # no re-render. Overwrites within a gameweek, frozen once it passes.
      - name: Dashboard weekly snapshot + archive index
        run: python scripts/archive_dashboard_week.py
        env:
          PYTHONPATH: "."

      - name: Commit + push regenerated artefacts
        run: |
          git config user.name "fpl-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/processed data/projections data/output data/snapshots data/history data/actuals data/state data/news dashboard/data.json dashboard/history.json dashboard/index.html dashboard/weeks
          if git diff --cached --quiet; then
            echo "No artefact changes this run."
          else
            git commit -m "chore: automated pipeline run ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi

      # v4 plan §3.3 (Tier 0.3): silent failure is the actual risk here,
      # not failure itself — an Actions failure email is easy to tune out.
      # Opens (or comments on, if still open) a single tracking issue rather
      # than one new issue per failed run.
      - name: Notify on failure (open/update a tracking issue)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Weekly pipeline failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The scheduled/dispatched run at ${new Date().toISOString()} failed.\n\nRun: ${runUrl}`;
            const openIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
            });
            const existing = openIssues.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
