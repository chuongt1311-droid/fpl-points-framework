# FPL Points-Maximization Framework — configuration
# Change values here, not in code. See docs/FPL_EXECUTION_PLAN.md for the
# rationale behind every number in this file.

season: "2026-27"          # the season whose GW1 the plan's "~48h" deadline refers to

# The operator's own FPL entry. PUBLIC — it's the number in the Points page
# URL (/entry/<id>/event/<gw>) — not a secret. Used by
# fpl/decide/squad_state.py to read the real squad from the public API.
# Sell prices and free transfers are NOT public and come from a locally
# pasted, gitignored my-team file; no credential is ever stored or handled.
fpl:
  entry_id: 6669718

squad_rules:
  budget_tenths: 1000        # £100.0m, in FPL's tenths-of-a-million units
  total: 15
  gk: 2
  def: 5
  mid: 5
  fwd: 3
  max_per_club: 3
  starting_xi:
    total: 11
    gk: 1
    min_def: 3
    min_mid: 2
    min_fwd: 1

horizon:
  gameweeks: 5
  decay_weights: [1.0, 0.85, 0.7, 0.55, 0.4]   # GW+1 ... GW+5, per plan §4.3

defcon:
  def_threshold_cbit: 10       # CBIT threshold for defenders
  mid_fwd_threshold_cbirt: 12  # CBIRT threshold for MID/FWD
  points: 2                    # binary, capped at 2 — see plan §4.2
  # 2025/26 is the only season with DEFCON scoring in FPL — do not
  # backfill DEFCON baselines from earlier seasons.
  baseline_season_only: "2025-26"

new_signing:
  # Still used to decide which players qualify to CONTRIBUTE to the
  # position/price-tier prior average (baseline.compute_price_tier_priors,
  # defcon.compute_price_tier_defcon_priors) — a 1-minute cameo shouldn't
  # pollute the peer average. NOT a confidence gate any more — see
  # `shrinkage` below (FPL_V2_DESIGN.md spec §4.1): a continuous shrinkage
  # weight replaced the old binary min_historical_minutes cliff, which is
  # why this key's old "below this -> low confidence" role is gone.
  min_historical_minutes: 450

# Empirical-Bayes shrinkage (FPL_V2_DESIGN.md spec §4.1) — replaces the old
# binary confidence cliff at min_historical_minutes. Per channel:
#   rate = w * personal + (1 - w) * prior,  w = m / (m + k)
# k is "the sample size at which personal and prior are trusted equally".
# One k for all points-channels for now (spec: "start with one k for all
# channels; split only if the data says to").
shrinkage:
  # Tuned against the repaired backtest (fpl/evaluate/backtest.py, spec
  # §3.5) — see docs/PROJECT_LOG.md for the full sweep table and reasoning.
  # Summary: RMSE and rank correlation both kept improving all the way out
  # to k~20000, which would mean even Haaland (weighted_minutes=5514, above
  # the 90th percentile of the pool) ends up MINORITY-personal (w=0.21) —
  # directly contradicting spec §4.1's own stated expectation ("Haaland-
  # class large-sample players barely move"), so minimising backtest loss
  # alone is the wrong criterion here. k=1500 is chosen as the point
  # solidly inside the range where the backtest already shows most of its
  # improvement (RMSE 21.82->20.97, rank corr 0.942->0.947 vs the naive
  # k=450 default) while keeping a genuinely nailed player majority-
  # personal (Haaland w=0.79) and meaningfully correcting a thin-sample
  # inflated-rate case (Osula w=0.44, now minority-personal — down from
  # 0.72 at k=450). Revisit once real 2026-27 squad/bench regret data
  # exists (spec §3.4) to confirm this against live outcomes, not just the
  # backtest.
  k: 1500
  # DEFCON's personal rate is matches-based, not minutes-based — a
  # genuinely different unit, not a second per-channel k (that restriction
  # is about points-channels sharing minutes; see fpl/project/defcon.py).
  # NOT backtested: 2025-26 is the only DEFCON-scored season, so there is
  # no leak-free train/test split to tune this against (same constraint
  # backtest.py documents for excluding DEFCON entirely). Chosen by analogy
  # to the old MIN_MATCHES_FOR_PERSONAL_RATE=10 binary floor it replaces —
  # revisit once a second DEFCON season exists.
  k_defcon: 10
  # w thresholds for the DERIVED categorical confidence label (dashboard +
  # optimiser's `allow_low_confidence` gate still read a label, not a raw
  # weight — plan §3.3's rule needs to keep meaning something).
  confidence_thresholds:
    low: 0.3
    high: 0.7

# v3 plan §B2 (model M2): blends the shrunk personal goal/assist rate with a
# shrunk xG90/xA90 rate — attacking_rate = v*xG90 + (1-v)*G90, v = k_xg /
# (weighted_minutes + k_xg). NOT the same as shrinkage.k: this is the
# G-vs-xG blend weight, not the personal-vs-prior weight (see
# fpl/project/xg_blend.py's docstring for the distinction).
xg_blend:
  # Fit against the same repaired backtest as shrinkage.k (train 2023-24 +
  # 2024-25, test 2025-26 actual minutes) — see docs/PROJECT_LOG.md for the
  # full sweep table. Overall RMSE improved monotonically from k_xg=50
  # (20.909) to k_xg=10000 (20.416) vs the no-blend baseline (20.973), so
  # -- same pattern as the shrinkage.k sweep -- minimising backtest RMSE
  # alone pushes toward an extreme. k_xg=1500 (matching shrinkage.k) is
  # chosen instead: solidly inside the range most of the gain is already
  # banked (RMSE 20.973->20.663, vs 20.416 at k_xg=10000), while keeping a
  # large-sample player's rate majority-personal rather than majority-proxy
  # (verified: Haaland v=0.214 -- mostly his own scoring record, not his
  # shot quality; Osula v=0.564 -- majority xG, the thin-sample case this
  # blend is meant to help). The assist channel's own RMSE optimum sits
  # around k_xg=4000-6000 (4.846 vs 4.901 at k_xg=1500, a ~1% difference)
  # -- not worth chasing at the cost of an extreme blend weight for
  # large-sample players. Not yet wired into live production (M0 unchanged)
  # -- M2 is a bakeoff candidate, not the champion; see plan §C5.
  k_xg: 1500

# v3 plan §B3 (model M3): further blends M2's rate toward Understat's
# npxG for players with a real cross-source identity match (plan §A5) --
# same functional shape as xg_blend's v, a SEPARATE k since this is a
# different blend (M2-rate-vs-npxG, not G90-vs-xG90). See
# docs/PROJECT_LOG.md for the fitting sweep.
understat_blend:
  k_npxg: 1500

transfers:
  free_per_gw: 1
  max_bank: 5
  hit_cost: 4
  buffer: 1.5                  # re-tune after backtest RMSE is known (Phase 3)

optimiser:
  # plan §3.3: "the optimiser will not recommend transferring in a low
  # confidence player unless explicitly unlocked by a toggle" — this is
  # that toggle. Applies to initial squad selection too (picking 15 from
  # scratch is transferring in 15 players).
  allow_low_confidence: false
  # Spec §4.4: small epsilon weight on every squad member in the stage-1
  # MILP objective, breaking ties among equally-priced eligible bench
  # players (previously arbitrary) and approximating real autosub value.
  # 0.02 is a starting value, not yet tuned against real bench regret
  # (spec §3.4 — no gameweek has finished to compute regret from yet).
  # Deliberately small: a genuine starting-XI xpts difference (even a
  # fraction of a point) must always outweigh epsilon * a bench player's
  # xpts, or this would start distorting real selection instead of just
  # breaking ties.
  bench_weight_epsilon: 0.02

chips:
  triple_captain_percentile: 0.90
  bench_boost_min_pts: 15
  free_hit_delta_min_pts: 20

position_multipliers:
  goals:
    GK: 10
    DEF: 6
    MID: 5
    FWD: 4
  assists_flat: 3
  clean_sheet_value:
    GK: 4
    DEF: 4
    MID: 1
    FWD: 0

# Fixed, universal FPL scoring rules (not tunable — real FPL rules, kept
# here rather than hardcoded in project.py so every scoring constant lives
# in one place per plan principle 5).
scoring_rules:
  appearance_60plus: 2
  appearance_1to59: 1
  yellow_card: -1
  red_card: -3
  saves_per_point: 3          # 1 pt per 3 saves
  conceded_per_point: 2       # -1 pt per 2 goals conceded (GK/DEF only)

minutes:
  # P(1-59 mins) = (1 - minutes_factor) * bench_cameo_rate — a simple,
  # explainable v1 approximation: most of the probability mass NOT covered
  # by "starts and plays 60+" is "doesn't feature at all," with a smaller
  # share going to a substitute cameo. See fpl/project/project.py.
  bench_cameo_rate: 0.3
  # GK-specific override (fpl/project/minutes.py): only one goalkeeper
  # plays per match, and the rolling-start-rate signal is backward-looking
  # (plan §10 limitation 6) — it has no notion of "who's the incumbent #1
  # at my CURRENT club" if a keeper started regularly at a PREVIOUS club.
  # Verified this is a real gap: it ranked a keeper with 1 start last
  # season above his own club's 37-start ever-present #1. FPL's own price
  # reliably signals the incumbent (checked across all 20 teams — the
  # highest-priced GK is the recognised #1 in every case). Backup GKs
  # (anyone but the highest-priced, ties broken by rolling_start_rate) get
  # their minutes_factor capped at this value.
  backup_gk_factor: 0.02

data:
  history_seasons: 3
  element_summary_shortlist_size: 150   # never loop all ~700 players — plan §3.1
  rate_limit_seconds: 1.0
  stale_data_warning_days: 4

api:
  base_url: "https://fantasy.premierleague.com/api"
  # No auth required. Identify the client generically — do not put personal
  # contact details in headers sent to a third-party service.
  user_agent: "fpl-points-framework/1.0 (personal analytics project)"

history:
  repo_raw_base: "https://raw.githubusercontent.com/vaastav/Fantasy-Premier-League/master/data"
  # Last 3 completed seasons, used for per-90 baselines and backtesting.
  # 2025-26 is the most recently completed season and the only one with
  # DEFCON scoring (see defcon.baseline_season_only above) — confirmed via
  # the archive: 2025-26/gws/merged_gw.csv has defensive_contribution and
  # clearances_blocks_interceptions columns; 2026-27 doesn't exist yet (404).
  seasons: ["2023-24", "2024-25", "2025-26"]
  # weight = recency_decay ** (seasons_ago), most recent season = 0 seasons ago.
  # With 3 seasons: oldest=0.36, middle=0.6, most recent=1.0.
  recency_decay: 0.6
  # position+price-tier prior fallback for new signings (plan §3.3): price
  # tier bucket width in £m.
  price_tier_width: 1.0
